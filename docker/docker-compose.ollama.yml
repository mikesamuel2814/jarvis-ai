# Optional: run Ollama inside Docker (needs NVIDIA Container Toolkit).
# Usage: docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
services:
  ollama:
    image: ollama/ollama:latest
    container_name: jarvis-ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - jarvis-net

  jarvis-api:
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama

  jarvis-telegram:
    environment:
      OLLAMA_HOST: http://ollama:11434

  jarvis-indexer:
    environment:
      OLLAMA_HOST: http://ollama:11434

  jarvis-train:
    environment:
      OLLAMA_HOST: http://ollama:11434

volumes:
  ollama_models:
