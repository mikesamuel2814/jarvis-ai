# Kali Linux Security Hardening Rules for JARVIS
# Applied via: sudo ufw enable && sudo systemctl enable apparmor

[firewall]
# Default deny all incoming
ufw_default_incoming = deny
ufw_default_outgoing = allow

# Allow localhost API access only
allow_127.0.0.1_port_8000 = true   # JARVIS API
allow_127.0.0.1_port_11434 = true  # Ollama
allow_127.0.0.1_port_8181 = true   # JARVIS v3 API

# Explicitly deny external API access
deny_0.0.0.0_port_8000 = true
deny_0.0.0.0_port_8181 = true

[services]
disable_bluetooth = true
disable_avahi_daemon = true
enable_nvidia_persistenced = true

[apparmor]
profile_path = /etc/apparmor.d/usr.local.bin.jarvis
mode = enforce

[audit]
enable_auditd = true
watch_paths = /home/kali/.jarvis/src/tools/,/var/log/jarvis/

[permissions]
jarvis_service_user = jarvis-service
jarvis_service_group = jarvis-service
log_dir = /var/log/jarvis
